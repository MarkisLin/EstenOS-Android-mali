name: Compilar DroidDeck Mali

on:
  workflow_dispatch:
  push:
    branches: [ main, mali-main ]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar SDK, NDK y CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;27.3.13750724' \
            'cmake;3.22.1'

      - name: Restaurar y verificar Gradle Wrapper
        shell: bash
        run: |
          chmod +x ./gradlew ./tools/gradle/bootstrap-wrapper.sh
          ./tools/gradle/bootstrap-wrapper.sh
          ./gradlew --version

      - name: Compilar APK debug Mali
        env:
          DROIDDECK_BUILD_LABEL: github-actions-mali
        run: ./gradlew :app:assembleDebug -PndkVersion=27.3.13750724 --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-Mali-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
