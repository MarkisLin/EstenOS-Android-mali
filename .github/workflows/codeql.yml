name: CodeQL profundo

on:
  push:
    branches: [ main, mali-main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  java-kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
          chmod +x ./gradlew ./tools/gradle/bootstrap-wrapper.sh
          ./tools/gradle/bootstrap-wrapper.sh

      - name: Initialize CodeQL Java/Kotlin
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build code for extraction
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac -PndkVersion=27.3.13750724 --stacktrace

      - name: Analyze Java/Kotlin
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL C/C++
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          queries: security-and-quality
      - name: Analyze C/C++
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
