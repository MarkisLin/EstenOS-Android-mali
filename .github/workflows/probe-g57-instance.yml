name: Probe G57 Vulkan 1.3 Instance

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-g57-instance.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Install Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev vulkan-tools unzip build-essential

      - name: Download exact EstenOS G57 driver
        run: |
          set -euo pipefail
          curl -L --fail \
            'https://github.com/kankwj5-eng/EstenOS-Android-mali/releases/download/panvk-g57-kbase-wayland-v1/panvk-g57-kbase-wayland-v1.zip' \
            -o /tmp/g57.zip
          echo 'a7826dfb403e7733313caf8529783a8d34f9c6848ecc0984b93d94f193d9843b  /tmp/g57.zip' | sha256sum -c -
          mkdir -p /tmp/g57
          unzip -q /tmp/g57.zip -d /tmp/g57
          file /tmp/g57/libvulkan_panfrost.so
          ldd /tmp/g57/libvulkan_panfrost.so

      - name: Build exact gamescope-style instance probe
        run: |
          cat >/tmp/probe.c <<'EOF'
          #include <stdio.h>
          #include <vulkan/vulkan.h>
          int main(void) {
            uint32_t loader = VK_API_VERSION_1_0;
            VkResult er = vkEnumerateInstanceVersion(&loader);
            printf("loader enumerate rc=%d version=%u.%u.%u\n", er,
                   VK_API_VERSION_MAJOR(loader), VK_API_VERSION_MINOR(loader), VK_API_VERSION_PATCH(loader));
            VkApplicationInfo ai = {
              .sType = VK_STRUCTURE_TYPE_APPLICATION_INFO,
              .pApplicationName = "gamescope-probe",
              .applicationVersion = 1,
              .pEngineName = "gamescope",
              .engineVersion = 1,
              .apiVersion = VK_API_VERSION_1_3,
            };
            VkInstanceCreateInfo ci = {
              .sType = VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO,
              .pApplicationInfo = &ai,
              .enabledExtensionCount = 0,
              .ppEnabledExtensionNames = NULL,
            };
            VkInstance inst = VK_NULL_HANDLE;
            VkResult rc = vkCreateInstance(&ci, NULL, &inst);
            printf("vkCreateInstance Vulkan 1.3 rc=%d instance=%p\n", rc, (void*)inst);
            if (inst) vkDestroyInstance(inst, NULL);
            return rc == VK_SUCCESS ? 0 : 1;
          }
          EOF
          cc -O2 /tmp/probe.c -lvulkan -o /tmp/probe

      - name: Probe historical EstenOS manifest 1.1.274
        shell: bash
        run: |
          cat >/tmp/icd-11.json <<EOF
          {"file_format_version":"1.0.0","ICD":{"library_path":"/tmp/g57/libvulkan_panfrost.so","api_version":"1.1.274"}}
          EOF
          set +e
          VK_DRIVER_FILES=/tmp/icd-11.json VK_ICD_FILENAMES=/tmp/icd-11.json VK_LOADER_DEBUG=all /tmp/probe 2>&1 | tee /tmp/probe-11.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "historical_manifest_rc=$rc"
          test "$rc" -eq 0

      - name: Probe corrected EstenOS manifest 1.3.0
        shell: bash
        run: |
          cat >/tmp/icd-13.json <<EOF
          {"file_format_version":"1.0.0","ICD":{"library_path":"/tmp/g57/libvulkan_panfrost.so","api_version":"1.3.0"}}
          EOF
          VK_DRIVER_FILES=/tmp/icd-13.json VK_ICD_FILENAMES=/tmp/icd-13.json VK_LOADER_DEBUG=all /tmp/probe 2>&1 | tee /tmp/probe-13.log
