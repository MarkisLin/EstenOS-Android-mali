name: Smoke Android ARM64

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/gradle/**'
      - '.github/workflows/android-arm64-smoke.yml'

jobs:
  arm64-smoke:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew ./tools/gradle/bootstrap-wrapper.sh
          ./tools/gradle/bootstrap-wrapper.sh

      - name: Boot ARM64 Android and smoke-test EstenOS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          ndk: 27.3.13750724
          cmake: 3.22.1
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            ./gradlew :app:assembleDebug -PndkVersion=27.3.13750724 --stacktrace
            bash tools/ci/emulator-smoke.sh

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-smoke-diagnostics
          path: build/ci-emulator/
          if-no-files-found: warn
