name: Revisión de calidad

on:
  workflow_dispatch:
  push:
    branches: [ main, mali-main ]
  pull_request:

jobs:
  android:
    name: Android lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar SDK, NDK y CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             'platforms;android-34'             'build-tools;34.0.0'             'ndk;27.3.13750724'             'cmake;3.22.1'

      - name: Restaurar Gradle Wrapper
        shell: bash
        run: |
          chmod +x ./gradlew ./tools/gradle/bootstrap-wrapper.sh
          ./tools/gradle/bootstrap-wrapper.sh

      - name: Pruebas y Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug -PndkVersion=27.3.13750724 --stacktrace

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  scripts:
    name: Shell/Python/workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar revisores
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Revisar workflows
        run: actionlint

      - name: Revisar scripts shell
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r -d '' f; do
            first="$(head -n1 "$f" || true)"
            if [[ "$first" =~ (/bin/(ba)?sh|/usr/bin/env[[:space:]]+(ba)?sh) ]]; then
              echo "shellcheck $f"
              shellcheck -x "$f" || failures=1
            fi
          done < <(find tools -type f -print0)
          exit "$failures"

      - name: Compilar sintaxis Python
        run: python3 -m compileall -q tools
