name: Bootstrap EstenOS Mali Stage 7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Stage 7 from pinned DroidDeck upstream
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PATCHES="$ROOT/bootstrap/patches"

          git clone https://github.com/Droid-Deck/DroidDeck.git "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git checkout --detach 6ecd6fa1d0cd293d3e55a0c7a7c71e9cde251c4f

          patch --batch --forward -p5 < "$PATCHES/01-stage1.patch"
          patch --batch --forward -p2 < "$PATCHES/02-stage2.patch"
          git apply "$PATCHES/03-stage3.patch"
          git apply "$PATCHES/04-stage4.patch"
          git apply "$PATCHES/05-stage5.patch"
          patch --batch --forward -p2 < "$PATCHES/06-stage5.1-buildfix.patch"
          git apply "$PATCHES/07-stage6.patch"
          git apply "$PATCHES/08-stage7.patch"

          # Stage 7 source distribution intentionally relies on the verified wrapper bootstrap.
          rm -f gradle/wrapper/gradle-wrapper.jar

          cd "$ROOT"
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/upstream/" "$ROOT/"

          git config user.name "EstenOS Mali Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "EstenOS Mali Stage 7: reproducible Mali-first base"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "Stage 7 reconstructed from Droid-Deck/DroidDeck@6ecd6fa1d0cd293d3e55a0c7a7c71e9cde251c4f." >> "$GITHUB_STEP_SUMMARY"
          echo "Stage patches 1 through 7 were applied in order and committed to main." >> "$GITHUB_STEP_SUMMARY"
