name: Calidad y regresiones

on:
  push:
    branches: [ main, mali-main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'

      - name: Gradle wrapper verificado
        run: |
          chmod +x ./gradlew ./tools/gradle/bootstrap-wrapper.sh
          ./tools/gradle/bootstrap-wrapper.sh

      - name: Unit tests + Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug -PndkVersion=27.3.13750724 --stacktrace

      - name: Python regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Shell syntax + ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          while IFS= read -r -d '' file; do
            bash -n "$file"
            shellcheck -S error "$file"
          done < <(find tools -type f -name '*.sh' -print0)

      - name: Validate executable runtime scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in             tools/linuxfs/overlay/usr/local/bin/bannerlator-session             tools/linuxfs/overlay/usr/local/bin/bannerlator-game-env             tools/linuxfs/overlay/usr/local/bin/bannerlator-proton-extra; do
            test -x "$f"
          done
