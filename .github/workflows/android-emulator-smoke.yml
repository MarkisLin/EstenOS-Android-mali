name: Smoke test en emulador Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/ci/**'
      - '.github/workflows/android-emulator-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/ci/**'
      - '.github/workflows/android-emulator-smoke.yml'

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android SDK para compilar ARM64
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             'platforms;android-34'             'build-tools;34.0.0'             'ndk;27.3.13750724'             'cmake;3.22.1'

      - name: Restaurar Gradle Wrapper y compilar APK
        shell: bash
        env:
          DROIDDECK_BUILD_LABEL: emulator-smoke-arm64
        run: |
          chmod +x ./gradlew ./tools/gradle/bootstrap-wrapper.sh
          ./tools/gradle/bootstrap-wrapper.sh
          ./gradlew :app:assembleDebug -PndkVersion=27.3.13750724 --stacktrace

      - name: Arrancar emulador ARM64 y probar APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash tools/ci/emulator-smoke.sh

      - name: Guardar logcat y captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-arm64-diagnostics
          path: build/ci-emulator/
          if-no-files-found: ignore
